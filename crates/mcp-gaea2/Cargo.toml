[package]
name = "mcp-gaea2"
version = "1.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Theorist100/gaea2-mcp"
description = "MCP server for Gaea terrain generation, targeting the installed build"

[[bin]]
name = "mcp-gaea2"
path = "src/main.rs"

[dependencies]
# MCP Core (vendored sibling crate)
mcp-core = { path = "../mcp-core" }

# Async runtime
tokio = { version = "1.40", features = ["full", "sync", "time", "process"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# HTTP client (for remote calls if needed)
reqwest = { version = "0.12", features = ["json"] }

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Base64 encoding
base64 = "0.22"

# Directories
dirs = "6.0"

# Tempfile handling
tempfile = "3.10"

# Async file I/O
tokio-util = { version = "0.7", features = ["io"] }

# UUID generation
uuid = { version = "1.8", features = ["v4"] }

# Random number generation
rand = "0.8"

# Glob pattern matching for file listing
glob = "0.3"

# Reading back the heightfields Gaea writes, to answer questions about the terrain itself
# rather than about the files.
png = "0.17"

# Gaea has to be started without a visible window and with a console of its own; the standard
# library cannot express that combination, so the process is created directly on Windows.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
tokio-test = "0.4"

# Release profile lives in the workspace manifest; a profile here would be ignored.
